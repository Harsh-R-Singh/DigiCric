<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <filter id="drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Ball Background -->
  <circle cx="50" cy="50" r="45" fill="url(#grad)" filter="url(#drop-shadow)" />
  
  <!-- Left Seam -->
  <path d="M 30 15 Q 55 50 30 85" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" />
  
  <!-- Right Seam -->
  <path d="M 70 15 Q 45 50 70 85" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" />
  
  <!-- Stitches -->
  <line x1="45" y1="35" x2="55" y2="35" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.6" />
  <line x1="45" y1="65" x2="55" y2="65" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.6" />

  <!-- Center Lightning Bolt (Volts / Digi) -->
  <path d="M 55 20 L 38 52 L 48 52 L 43 80 L 65 46 L 53 46 Z" fill="#fbbf24" stroke="#ffffff" stroke-width="2" stroke-linejoin="round" filter="url(#drop-shadow)" />
</svg>