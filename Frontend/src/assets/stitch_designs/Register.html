<div class="bg-surface-container/60 backdrop-blur-xl border border-outline-variant/20 rounded-xl p-8 md:p-12 shadow-[0_0_50px_rgba(236,91,19,0.1)] relative overflow-hidden">
<!-- Branding Section -->
<div class="flex flex-col items-center mb-10">
<img alt="DigiCric Official Logo" class="h-20 w-auto mb-6 drop-shadow-[0_0_15px_rgba(236,91,19,0.4)]" data-alt="high-tech stylized cricket logo featuring sharp orange geometric lines and a vibrant electric pulse against a dark background" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBWGwadMdDTQLLZl8Tj8xG-AQX1GKTvnrv498s0tV_xn-8qEpyH0Q5VLp8GfxbBUoS-Z6iPsiw3xFLN5BMvXbh92olydj5j7Yn89PmkIPkSujiRJ5Q7cqH8LhmoAwdFugmLe4c6v_QRpZtmmtrpGGDoS8wxJDJDT3gZ8E2TdmDqtihBxN_XtANxRtPG9kduLZexxcHpZgUgbblx-UfBdSQxzziIZkl9LJwwIjZfwWD0iQakQbf99Ek6tiFRWHzrC9n_Lf9RszlFlv0"/>

<p class="font-label text-primary font-bold uppercase tracking-widest text-[10px]">Precision. Power. Performance.</p>
</div>
<!-- Registration Form -->
<form class="space-y-6">
<!-- Username Input -->
<div class="space-y-2">
<label class="font-label text-[12px] font-bold uppercase tracking-[0.05em] text-on-surface-variant block ml-1">USERNAME</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-primary/60 text-[20px]">person</span>
<input class="w-full bg-surface-container-low border-0 border-b-2 border-outline-variant/30 focus:border-primary focus:ring-0 text-on-surface placeholder:text-on-surface-variant/30 font-medium py-4 pl-12 pr-4 transition-all duration-300" placeholder="CRIC_MASTER_99" type="text"/>
</div>
</div>
<!-- Email Input -->
<div class="space-y-2">
<label class="font-label text-[12px] font-bold uppercase tracking-[0.05em] text-on-surface-variant block ml-1">EMAIL ADDRESS</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-primary/60 text-[20px]">alternate_email</span>
<input class="w-full bg-surface-container-low border-0 border-b-2 border-outline-variant/30 focus:border-primary focus:ring-0 text-on-surface placeholder:text-on-surface-variant/30 font-medium py-4 pl-12 pr-4 transition-all duration-300" placeholder="PLAYER@DIGICRIC.GG" type="email"/>
</div>
</div>
<!-- Password Input -->
<div class="space-y-2">
<label class="font-label text-[12px] font-bold uppercase tracking-[0.05em] text-on-surface-variant block ml-1">PASSWORD</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-primary/60 text-[20px]">lock</span>
<input class="w-full bg-surface-container-low border-0 border-b-2 border-outline-variant/30 focus:border-primary focus:ring-0 text-on-surface placeholder:text-on-surface-variant/30 font-medium py-4 pl-12 pr-4 transition-all duration-300" placeholder="••••••••••••" type="password"/>
</div>
</div>
<!-- Action Button -->
<button class="w-full bg-primary hover:bg-primary/90 text-white font-headline font-black text-lg py-5 rounded-lg transition-all duration-300 shadow-[0_0_25px_rgba(236,91,19,0.3)] hover:shadow-[0_0_40px_rgba(236,91,19,0.5)] active:scale-[0.98] uppercase tracking-wider mt-4" type="submit">

                    </button>

<div class="mt-10 text-center">
<p class="font-label text-on-surface-variant text-[14px]">
                        ALREADY HAVE AN ACCOUNT? 
                        <a class="text-primary font-bold hover:underline transition-all ml-1" href="#">LOGIN</a>
</p>
</div>

<div class="absolute -bottom-1 -right-1 w-12 h-12 border-r-2 border-b-2 border-primary/40"></div>
<div class="absolute -top-1 -left-1 w-12 h-12 border-l-2 border-t-2 border-primary/40"></div>
